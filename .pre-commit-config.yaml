# See https://pre-commit.com for more information
# Install: pip install pre-commit && pre-commit install
# Style settings: pyproject.toml [tool.ruff*]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
