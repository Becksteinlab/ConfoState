[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confostate"
version = "0.1.0"
description = "Classify membrane protein structures into conformational states"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ConfoState Contributors"}
]

dependencies = [
