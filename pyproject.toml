[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confostate"
version = "0.1.0"
description = "Classify membrane protein structures into conformational states"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ConfoState Contributors"}
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2024.1.0",
    "sphinx-copybutton>=0.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2024.1.0",
    "sphinx-copybutton>=0.5",
    "black>=22.0",
    "flake8>=4.0",
]

[tool.setuptools]
packages = ["confostate"]

[tool.setuptools.package-data]
confostate = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["confostate"]
branch = true
