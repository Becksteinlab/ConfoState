name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[lint]"

    - name: Ruff check
      run: ruff check .

    - name: Ruff format
      run: ruff format --check --diff .
